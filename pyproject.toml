[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "module-screener"
version = "0.1.0"
description = "A command-line module interest screener"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
module-screener = "module_screener.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
